<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Просмотр вопросов</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: clamp(12px, 2vw, 28px);
    }
    h1 {
      text-align: center;
      margin-bottom: 1em;
    }
    #content {
      width: min(1800px, 96vw);
      margin: 0 auto;
    }
    .question-block {
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 1em;
      margin-bottom: 1.5em;
      box-sizing: border-box;
    }
    .question {
      font-weight: bold;
      margin-bottom: 0.5em;
    }
    .answer {
      color: #8bc34a;
    }
    pre {
      background: #2c2c2c;
      padding: 1em;
      border-radius: 6px;
      overflow-x: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 0.5em;
      color: #c8e6c9;
      font-family: monospace;
      font-size: clamp(12px, 1.2vw, 15px);
    }
    footer {
      margin-top: 3em;
      text-align: center;
      font-size: 0.8em;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>Просмотр вопросов</h1>
  <div id="content">Загрузка...</div>

  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get("file");

    const content = document.getElementById("content");

    if (!file) {
      content.innerHTML = "<p style='color:red;'>❌ Файл не указан в URL</p>";
    } else {
      fetch(`data/${file}?t=${Date.now()}`)
        .then(res => {
          if (!res.ok) {
            throw new Error("Ошибка загрузки файла");
          }
          return res.json();
        })
        .then(data => {
          content.innerHTML = "";

          const escapeHTML = str =>
            str.replace(/&/g, "&amp;")
               .replace(/</g, "&lt;")
               .replace(/>/g, "&gt;");

          let index = 1;
          for (const [term, definition] of Object.entries(data)) {
            const block = document.createElement("div");
            block.className = "question-block";

            const question = document.createElement("div");
            question.className = "question";
            question.textContent = `${index++}. ${term}`;

            const answer = document.createElement("div");
            answer.className = "answer";

            const isMultilineCode = definition.includes("\n") || definition.includes("    ");
            if (isMultilineCode) {
              answer.innerHTML = `<pre><code>${escapeHTML(definition)}</code></pre>`;
            } else {
              answer.innerHTML = `📘 <strong>${definition}</strong>`;
            }

            block.appendChild(question);
            block.appendChild(answer);
            content.appendChild(block);
          }
        })
        .catch(err => {
          content.innerHTML = "<p style='color:red;'>❌ Ошибка загрузки файла</p>";
          console.error("Ошибка загрузки JSON:", err);
        });
    }
  </script>

  <footer>
    © 2025 | Просмотр тем тестирования
  </footer>

</body>
</html>
